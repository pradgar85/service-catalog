services:
  postgres:
    image: postgres:15-alpine
    container_name: service-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-catalog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalog}
      POSTGRES_DB: ${DB_DATABASE:-service_catalog}
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-catalog} -d ${DB_DATABASE:-service_catalog}']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: service-catalog-adminer
    restart: unless-stopped
    depends_on:   
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
